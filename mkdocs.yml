site_name: Informática · UEA 2211088
site_description: >-
  Unidad de Enseñanza-Aprendizaje Informática · Licenciatura en Administración ·
  UAM-Iztapalapa · Aprendizaje basado en proyectos
site_author: dr. Jesús Zavala Ruiz
site_url: https://jzavalar.github.io/Informatica/
repo_url: https://github.com/jzavalar/Informatica
repo_name: jzavalar/Informatica
edit_uri: edit/main/docs/
copyright: >-
  Universidad Autónoma Metropolitana, Unidad Iztapalapa ·
  División de Ciencias Sociales y Humanidades

theme:
  name: material
  language: es
  favicon: assets/conjunto-baseIzt.png
  logo: assets/conjunto-baseIzt.png
  features:
    - navigation.instant       # navegación sin recarga completa
    - navigation.tracking
    - navigation.tabs          # proyectos / lecturas / curso como pestañas
    - navigation.sections
    - navigation.top
    - navigation.footer        # anterior / siguiente al pie: guía la secuencia
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit      # botón "editar esta página" → pull request
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

plugins:
  - search:
      lang: es
  - tags

markdown_extensions:
  - admonition                 # cajas de aviso: "Regla", "Sin IA", "Entrega"
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3

extra:
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:jzr@xanum.uam.mx
      name: Correo del profesor
    - icon: fontawesome/brands/telegram
      link: https://t.me/jzavalar
      name: Telegram

