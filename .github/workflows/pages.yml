# Guardar como .github/workflows/pages.yml
#
# Requisito único: en GitHub → Settings → Pages → Source, elegir "GitHub Actions".
# A partir de ahí, cada push a main republica el sitio en
# https://jzavalar.github.io/Informatica/

name: Publicar sitio del curso

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar MkDocs Material
        run: pip install -r requirements.txt

      - name: Construir el sitio
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
